site_name: OpenUnderstand Docs
site_url: https://m-zakeri.github.io/OpenUnderstand
repo_url: https://github.com/m-zakeri/OpenUnderstand
site_description: An open-source implementation of Understand Python API for Java language
site_author: Morteza Zakeri
copyright: © 2021-2026 OpenUnderstand project - IUST Reverse Engineering Research Laboratory

theme:
  name: material
  palette:
    - scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Dark mode
    - scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/toggle-switch
        name: Light mode

plugins:
  - search
# mkdocstrings was dropped: no page carries a `:::` directive any more -- the API
# reference is written by hand -- and its 2021 configuration (`setup_commands`,
# `selection`) is rejected outright by the current handler, which is what broke
# the docs build.

nav:
    - Home: index.md
    - API reference: api.md
    - Kinds: kinds.md
    - Architecture: architecture.md
    - Parity with Understand: parity.md
    - Metric parity: metric-parity.md
    - MCP server: mcp.md
    - IntelliJ IDEA plugin: idea-plugin.md
    - Issue tracker: 'https://github.com/m-zakeri/OpenUnderstand/issues'
