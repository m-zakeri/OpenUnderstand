[build-system]
# speedy-antlr-tool is a *build* dependency, not a runtime one: setup.py uses
# it to generate the C++ accelerator's sources, and the finished wheel never
# imports it. A machine without a JDK or cmake still builds fine -- setup.py
# probes and falls back to the pure-Python package.
#
# packaging>=24.2 is not decoration. `license = "MIT"` below is a PEP 639 SPDX
# expression, and setuptools>=77 canonicalises it through `packaging.licenses`,
# which 24.1 does not have. Without the floor, any build environment holding an
# older packaging dies in get_requires_for_build_wheel with "Cannot import
# packaging.licenses" before setup.py runs at all -- which is what cibuildwheel
# 2.21's pinned constraints did to every macOS and Windows wheel.
requires = ["setuptools>=64", "wheel", "speedy-antlr-tool>=1.4", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "openunderstand"
dynamic = ["version"]
description = "An open-source implementation of the SciTools Understand Python API for Java"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Morteza Zakeri", email = "m-zakeri@live.com" },
    { name = "Amin Hasan Zarei", email = "amin.hasan.zarei@gmail.com" },
]
maintainers = [
    { name = "Morteza Zakeri", email = "m-zakeri@live.com" },
    { name = "Amin Hasan Zarei", email = "amin.hasan.zarei@gmail.com" },
]
keywords = ["understand", "scitools", "static-analysis", "java", "antlr", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Topic :: Software Development :: Quality Assurance",
]

# Runtime only. pybind11 and speedy-antlr-tool used to be listed here, but they
# build the optional C++ accelerator -- they are not needed to import or use
# this package, and forcing a compiler toolchain on every user for a component
# most never build is not reasonable.
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "peewee>=3.17,<4",
]

[project.optional-dependencies]
# Building the C++ parser accelerator from source. Not needed to *use* it: the
# published wheels ship it compiled, and `pip install openunderstand` is
# enough. This extra is for a checkout or an sdist build, and a JDK, cmake and
# a C++17 compiler have to be present alongside it. pybind11 used to be listed
# here and never belonged -- speedy-antlr-tool generates raw CPython C API
# code and does not use it.
speedy = ["speedy-antlr-tool>=1.4"]
metrics = ["pandas>=1.1.5", "GitPython>=3.1.32"]
# An MCP server exposing the analysis as tools, for assistants.
mcp = ["mcp>=1.2"]
dev = ["pytest>=7", "black", "build", "twine"]

[project.urls]
Homepage = "https://github.com/m-zakeri/OpenUnderstand"
Documentation = "https://m-zakeri.github.io/OpenUnderstand"
Source = "https://github.com/m-zakeri/OpenUnderstand"
Issues = "https://github.com/m-zakeri/OpenUnderstand/issues"

[project.scripts]
openunderstand = "openunderstand.ounderstand.openunderstand:parse_arguments"
openunderstand-mcp = "openunderstand.mcp_server:main"

[tool.setuptools.dynamic]
# One place only: openunderstand/__init__.py.
version = { attr = "openunderstand.__version__" }

[tool.setuptools.packages.find]
# From the repository root, so the installed package is `openunderstand` and
# its subpackages. The previous layout set package_dir to "openunderstand",
# which installed `oudb`, `gen`, `metrics` and `utils` at top level -- names
# that collide with other projects -- while every import in this codebase says
# `openunderstand.oudb...`, so the installed package could not import itself.
where = ["."]
include = ["openunderstand*"]
exclude = ["openunderstand.gen.java8speedy.build-cache*"]

[tool.setuptools.package-data]
# The seed files are load-bearing: fill.py reads them to populate the kind
# tables, and without them a database has no vocabulary. The .interp/.tokens
# files ship with the generated parsers.
"openunderstand.oudb" = ["*.txt", "*.txt.gz"]
"openunderstand.gen.javaLabeled" = ["*.interp", "*.tokens"]
"openunderstand.gen.java8speedy" = ["*.md"]

[tool.black]
line-length = 88
