name: release-plugin

# Publishes the IDEA plugin to the JetBrains Marketplace when a plugin-v* tag is
# pushed. Separate from release.yml and its v* tags because the plugin and the
# library version independently: a plugin release bundles whatever analyser
# version is current.
#
# Needs one secret, PUBLISH_TOKEN: plugins.jetbrains.com -> your profile ->
# My Tokens -> Generate. The plugin must already exist on the Marketplace; the
# first version of a plugin has to go through the web form.
#
# The plugin bundles the analyser wheel, so the Python build runs first --
# without dist/*.whl the plugin still builds, but falls back to installing the
# analyser from PyPI at the user's first run instead of shipping it.

on:
  push:
    branches: [master]
    tags: ["plugin-v*"]
  workflow_dispatch:

jobs:
  # Merging cannot simply publish: the Marketplace rejects a version it already
  # holds, so every other merge would fail. Publish only when this push changed
  # the `version` line in build.gradle.kts -- bump it in the pull request and
  # merging ships the plugin, merge anything else and this does nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: check
        name: Did this push change the plugin version?
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag push -- publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE="${GITHUB_SHA}^" ;; esac
          if git diff "$BEFORE" "$GITHUB_SHA" -- idea-plugin/build.gradle.kts | grep -qE '^\+version = '; then
            echo "plugin version changed -- publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin version unchanged -- nothing to release"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: jetbrains
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Build the analyser wheel to bundle
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          ls -l dist

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }

      - name: The tag must match the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#plugin-v}"
          VERSION=$(grep -oP '^version = "\K[^"]+' idea-plugin/build.gradle.kts)
          echo "tag=$TAG plugin=$VERSION"
          [ "$TAG" = "$VERSION" ] || { echo "tag and version disagree" >&2; exit 1; }

      # -PideaHome= overrides the developer path in gradle.properties, so the
      # build downloads a platform instead of looking for an IDE that is not here.
      - name: Build and verify
        working-directory: idea-plugin
        run: gradle buildPlugin verifyPlugin -PideaHome= --no-daemon

      # Reaching here already means the gate opened: a tag, or a merge that
      # changed the plugin version.
      - name: Publish to the Marketplace
        working-directory: idea-plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gradle publishPlugin -PideaHome= --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: idea-plugin/build/distributions/*.zip
