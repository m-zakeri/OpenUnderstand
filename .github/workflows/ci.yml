name: CI Pipeline

on:
  push:
    branches: [ "feature/testing-404131069" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov coverage ruff peewee

      - name: Run linting
        run: |
          ruff check tests/ || true

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Run coverage
        run: |
          pytest tests/ --cov=tests --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
