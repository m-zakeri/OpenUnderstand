name: CI

# Industrial-grade CI/CD pipeline for the OpenUnderstand unit-test suite
# (Homework 3, Part 2).
#
# Pipeline stages:
#   1. Install dependencies            (reproducible, pip-cached)
#   2. Run linting                     (ruff)
#   3. Run unit tests                  (pytest)
#   4. Run coverage analysis           (coverage.py / pytest-cov, branch=on)
#   5. Generate test reports           (JUnit XML + Cobertura XML + HTML)
#   6. Upload artifacts                (reports kept for download)
#   7. Fail the build on quality-gate violations:
#        - line coverage   >= 80%
#        - branch coverage >= 70%
#        - all tests passing
#        - zero linting errors

on:
  push:
    branches: ["master", "main", "feature/**"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Also run mutation testing (slow)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"   # deterministic runs -> pipeline reproducibility

jobs:
  # ----------------------------------------------------------------------- #
  # Stage A: Linting (fast fail on style/lint errors -> "zero lint" gate)   #
  # ----------------------------------------------------------------------- #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff (zero-error gate)
        run: ruff check tests

  # ----------------------------------------------------------------------- #
  # Stage B: Tests + coverage + quality gates                               #
  # ----------------------------------------------------------------------- #
  test:
    name: Tests & coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (reproducible)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage + reports
        run: |
          mkdir -p reports
          pytest tests \
            --cov=openunderstand.oudb.api \
            --cov=openunderstand.oudb.models \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json \
            --cov-report=html \
            --junitxml=reports/junit.xml

      - name: Enforce coverage quality gates (line >= 80%, branch >= 70%)
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("coverage.json"))
          totals = data["totals"]
          line = totals["percent_covered"]
          nb = totals.get("num_branches", 0)
          cb = totals.get("covered_branches", 0)
          branch = (cb / nb * 100) if nb else 100.0
          print(f"Line coverage:   {line:.2f}%  (gate: >= 80%)")
          print(f"Branch coverage: {branch:.2f}%  (gate: >= 70%)")
          failed = []
          if line < 80:
              failed.append(f"line coverage {line:.2f}% < 80%")
          if branch < 70:
              failed.append(f"branch coverage {branch:.2f}% < 70%")
          if failed:
              print("QUALITY GATE FAILED: " + "; ".join(failed))
              sys.exit(1)
          print("Quality gates passed.")
          PY

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            coverage.xml
            coverage.json
          if-no-files-found: warn

      - name: Upload coverage to Codecov (optional)
        if: ${{ matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ----------------------------------------------------------------------- #
  # Stage C: Mutation testing (Part 5) - opt-in, non-blocking               #
  # ----------------------------------------------------------------------- #
  mutation:
    name: Mutation testing (mutmut)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutation }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mutation testing
        run: |
          mkdir -p reports
          mutmut run || true
          mutmut results || true
          mutmut junitxml > reports/mutmut-junit.xml || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutmut-junit.xml
          if-no-files-found: warn
