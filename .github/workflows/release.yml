name: release

# Publishes to PyPI when a v* tag is pushed, or when a merge to master raises
# __version__.
#
# Merging cannot simply publish: PyPI refuses to reuse a version, so every other
# merge would fail the build. The `version` job below is the gate -- it publishes
# only when this push actually changed the `__version__` line, which is the one
# thing that makes a release a release. Bump the version in the pull request and
# merging it ships; merge anything else and this does nothing.
#
# Uses Trusted Publishing (OIDC) -- no API token is stored anywhere. Set it up
# once at pypi.org -> Your projects -> Publishing -> Add a pending publisher,
# with owner/repository/workflow matching this file. A "pending" publisher is
# what lets the first release create the project.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: check
        name: Did this push change __version__?
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag push -- publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          # All-zero on a branch's first push, and absent on workflow_dispatch.
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE="${GITHUB_SHA}^" ;; esac
          if git diff "$BEFORE" "$GITHUB_SHA" -- openunderstand/__init__.py | grep -q '^+__version__'; then
            echo "__version__ changed -- publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "__version__ unchanged -- nothing to release"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Binary wheels carrying the C++ parse accelerator, one per Python minor per
  # platform, plus the sdist. Defined once in wheels.yml because the plugin
  # release needs the same thing.
  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/wheels.yml

  verify:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: python -m pip install --upgrade pip twine

      - name: Every wheel must be tagged, and the set must cover the matrix
        # A pure-Python wheel reaching PyPI would shadow every binary one for
        # the platforms it claims, so this is the check that matters most.
        run: |
          ls -l dist
          if ls dist/*-py3-none-any.whl >/dev/null 2>&1; then
            echo "a py3-none-any wheel is present -- the accelerator silently did not build" >&2
            exit 1
          fi
          # Five: cp39 through cp313, Linux x86_64 only. Raise this in step
          # with wheels.yml's matrix -- it is what catches a platform whose
          # job failed while the others succeeded.
          COUNT=$(ls dist/*.whl | wc -l)
          echo "$COUNT binary wheels"
          [ "$COUNT" -ge 5 ] || { echo "too few wheels; part of the matrix failed" >&2; exit 1; }

      - name: The tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('openunderstand/__init__.py').read_text()).group(1))")
          echo "tag=$TAG package=$VERSION"
          [ "$TAG" = "$VERSION" ] || { echo "tag and version disagree" >&2; exit 1; }
        if: startsWith(github.ref, 'refs/tags/')

      - name: The wheel must install and work
        # PyPI versions cannot be reused, so a broken release is permanent.
        run: |
          VERSION=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('openunderstand/__init__.py').read_text()).group(1))")
          python -m venv /tmp/clean
          # --find-links, not dist/*.whl: dist/ holds one wheel per Python
          # minor and only one matches this interpreter, so let pip choose.
          #
          # The index stays enabled, and --no-index is what broke this step
          # the first time it ran: dist/ carries openunderstand and nothing
          # else, so antlr4-python3-runtime and peewee cannot resolve without
          # it. Pinning the exact version is what still guarantees the wheel
          # under test is the one installed -- no index carries this version
          # yet, since publishing it is the next job.
          /tmp/clean/bin/pip install --force-reinstall \
              --find-links dist/ "openunderstand==$VERSION"
          mkdir -p /tmp/src && printf 'public class T { public int f(int a) { return a > 0 ? a : -a; } }\n' > /tmp/src/T.java
          cd /tmp && /tmp/clean/bin/python - <<'PY'
          import contextlib, io, os, tempfile
          from openunderstand.oudb.api import create_db, open as ou_open
          from openunderstand.oudb.fill import fill
          from openunderstand.ounderstand.parsing_process import process_file
          out = tempfile.mkdtemp()
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              create_db(dbname="r.udb", project_dir="/tmp/src", db_path=out)
              fill(udb_path=out)
              process_file("/tmp/src/T.java")
              db = ou_open(os.path.join(out, "r.udb"))
              classes = db.ents("Class")
          assert classes, "installed wheel found no classes"
          print("wheel installs and analyses:", len(classes), "classes")
          PY

      - name: The installed wheel must carry the accelerator
        run: |
          /tmp/clean/bin/python -c "
          from openunderstand.utils import antler_parser as a
          assert a.is_available(), a.unavailable_reason()
          print('accelerator present in the published wheel')
          "

      - run: python -m twine check dist/*

  publish:
    # `build` only runs when the version gate opened, so reaching here is
    # already the decision -- a tag, or a merge that raised __version__.
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
