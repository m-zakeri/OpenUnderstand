name: wheels

# Builds the binary wheels that carry the speedy-antlr C++ parse accelerator,
# plus the sdist. `release.yml` calls this and publishes what it produces, so
# there is one definition of how a wheel is made.
#
# Why binary wheels at all: the accelerator parses Java ~7.8x faster than the
# pure-Python ANTLR runtime, and it cannot be built at install time by a normal
# user -- it needs a JDK to run ANTLR's code generator, cmake to build the
# ANTLR C++ runtime, and a C++17 compiler. Shipping it compiled is the only way
# most people ever get it.
#
# `speedy-antlr-tool` generates raw CPython C API code with no Py_LIMITED_API,
# so there is no abi3 shortcut: this is one wheel per Python minor per
# platform. Any platform without a wheel falls back to the sdist, whose
# setup.py probes for the toolchain and quietly builds the pure-Python package
# instead -- which is exactly what this project shipped before.
#
# OPENUNDERSTAND_BUILD_ACCELERATOR=1 makes a missing toolchain a hard error, so
# a silently pure wheel can never be published under a platform tag.

on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding dist/
        value: dist
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  arch: x86_64 }
          - { os: macos-14,       arch: arm64 }
          - { os: windows-latest, arch: AMD64 }
          # No Intel macOS. GitHub retired the macos-13 runner and every macOS
          # image it still offers is Apple silicon, so such a job does not
          # fail, it queues forever and the release waits on it. Intel Macs
          # resolve to the sdist and the pure-Python parser.
    steps:
      - uses: actions/checkout@v4

      # The ANTLR code generator is a Java program. This installs one on the
      # runner; the manylinux *container* needs its own, which is what
      # CIBW_BEFORE_ALL below installs.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # v4.2, for cp314: 2.23 has no Python 3.14 target at all, so adding
      # cp314-* to CIBW_BUILD below matches nothing before 3.0.
      #
      # Do not go back below 2.22. cibuildwheel exports its pinned constraints
      # as PIP_CONSTRAINT into the isolated build environment, and 2.21 pinned
      # packaging==24.1, while setuptools>=77 needs packaging>=24.2 to
      # canonicalise this project's SPDX license expression -- every macOS and
      # Windows wheel died in get_requires_for_build_wheel. The pyproject floor
      # makes that independent of cibuildwheel now, but the pin is still what
      # decides which packaging the build environment gets.
      #
      # Free-threaded builds stay out: their identifiers are cp314t-*, which
      # cp314-* does not match, and 4.x keeps them behind an opt-in anyway.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: build

          # The compiler's own output. Without it a failed build reports only
          # "python -m build failed with code 1", which is not diagnosable.
          CIBW_BUILD_VERBOSITY: "1"

          # manylinux2014 is CentOS 7, whose yum mirrors were retired when it
          # went EOL in June 2024: `yum install` fails, the apt-get fallback
          # does not exist there, and the shell exits 127. manylinux_2_28 is
          # AlmaLinux 8 with live repos and dnf.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Inside the manylinux container, not on the runner. The runner's
          # own JDK is not visible in there, which is why this installs one.
          CIBW_BEFORE_ALL_LINUX: dnf install -y java-17-openjdk-devel cmake gcc-c++

          # The C++ runtime build and the generated sources are identical for
          # every Python in the matrix, so let them be reused across the five
          # builds on a runner instead of recompiling ANTLR five times.
          CIBW_ENVIRONMENT: OPENUNDERSTAND_BUILD_ACCELERATOR=1
          CIBW_ENVIRONMENT_LINUX: OPENUNDERSTAND_BUILD_ACCELERATOR=1 JAVA_HOME=/usr/lib/jvm/java-17-openjdk

          # A wheel that imports but whose accelerator silently did not ship is
          # the failure this whole file exists to prevent, so assert it.
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: >
            python -c "from openunderstand.utils import antler_parser as a;
            assert a.is_available(), a.unavailable_reason();
            print('accelerator present')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: The sdist must install without a toolchain
        # This is the fallback everyone without a matching wheel gets. It has
        # to work on a machine with no JDK, no cmake and no compiler, which is
        # what setup.py's probe is for.
        run: |
          python -m venv /tmp/nojdk
          env -u JAVA_HOME PATH=/usr/bin:/bin \
            /tmp/nojdk/bin/pip install dist/*.tar.gz
          /tmp/nojdk/bin/python -c "
          import openunderstand
          from openunderstand.utils import antler_parser as a
          print('sdist installs; accelerator present:', a.is_available())
          "
      - uses: actions/upload-artifact@v4
        with: { name: wheels-sdist, path: dist/*.tar.gz }

  collect:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: wheels-*, path: staging, merge-multiple: true }
      - run: mkdir -p dist && mv staging/* dist/ && ls -l dist
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
