<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    The OpenUnderstand mark from docs/figs/OpenUnderstand_Logo.png, redrawn for
    40x40: the hexagon frame, the monitor and its orbit. The wordmark is left
    out on purpose, because "OPEN UNDERSTAND" set across 40 pixels is a smudge
    and the hexagon is what makes the logo recognisable at this size. Colours
    are sampled from the PNG: frame #fb9c2a, screen #f25938 to #fb9c2a.

    Note for editing: XML forbids a double hyphen inside a comment, so the
    house style for an em dash cannot be used in this file. A strict parser
    rejects the whole document, which is how this icon first failed to open.
  -->
  <defs>
    <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f25938"/>
      <stop offset="1" stop-color="#fb9c2a"/>
    </linearGradient>
  </defs>

  <!-- Flat chevrons with a wide side gap, as in the logo. Meeting them closer
       to the middle turns the hexagon into a diamond at this size. -->
  <g fill="none" stroke="#fb9c2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 13.5 L20 4 L37.5 13.5"/>
    <path d="M2.5 26.5 L20 36 L37.5 26.5"/>
  </g>

  <ellipse cx="20" cy="20" rx="12" ry="4.6" transform="rotate(-20 20 20)"
           fill="none" stroke="#f25938" stroke-width="1.5"/>

  <g>
    <rect x="14" y="15" width="12" height="8.6" rx="1.4" fill="url(#screen)"/>
    <path d="M20 23.6 L20 26 M16.5 26 L23.5 26" stroke="#f25938" stroke-width="1.5"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
