# Mutation-testing configuration for mutmut (Part 5).
#
# mutmut 2.x reads this [mutmut] section automatically.  We mutate only the
# module under test (the api/db layer) and run the isolated unit suite as the
# test command, so each mutant is evaluated quickly.
#
#   mutmut run        # generate & test mutants
#   mutmut results    # summary of survived / killed
#   mutmut html       # browsable report in ./html/index.html
#   mutmut show <id>  # diff for a specific surviving mutant
[mutmut]
paths_to_mutate=openunderstand/oudb/api.py
tests_dir=tests/
runner=python -m pytest tests -x -q --no-header
