# Mutation-testing configuration for mutmut (Part 5).
#
# NOTE: written for mutmut 3.x, which is what `requirements-dev.txt` resolves
# to.  mutmut 2.x used `paths_to_mutate` / `tests_dir` / `runner`; those keys are
# deprecated (2.x names still load but emit warnings) and `runner` is no longer
# read at all -- mutmut 3.x invokes pytest itself.  Using the 3.x names keeps the
# run warning-free and the test selection effective.
#
#   mutmut run              # generate & test mutants
#   mutmut results          # summary of survived / killed
#   mutmut browse           # interactive TUI report
#   mutmut show <id>        # diff for a specific surviving mutant
#   mutmut export-cicd-stats  # machine-readable summary for CI
#
# mutmut has no native Windows support (boxed/mutmut#397); on Windows use the
# Cosmic Ray configuration in `cosmic-ray.toml` instead.
[mutmut]
source_paths=openunderstand/oudb/api.py
pytest_add_cli_args_test_selection=tests/unit
